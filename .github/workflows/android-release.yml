name: Android - Test, Build Release APK & Upload to Server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Push beruntun ke main: build lama dibatalkan, cuma commit terbaru yang di-upload.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # .env & keystore.properties gitignored - di CI dibikin dari GitHub Secrets.
      # build.gradle.kts baca BASE_URL/API_KEY/... dari .env, dan signing dari env var
      # ANDROID_KEYSTORE_PATH/RELEASE_* kalau keystore.properties gak ada.
      - name: Generate .env
        run: |
          cat > .env <<EOF
          BASE_URL=${{ secrets.BASE_URL }}
          API_KEY=${{ secrets.API_KEY }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          CLIENT_TYPE=${{ secrets.CLIENT_TYPE || 'ANDROID' }}
          EOF

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Release pakai chucker library-no-op - gak ada HTTP inspector di APK ini.
      - name: Assemble release
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APK
        id: apk
        run: |
          name="klarfinance-$(date -u +%Y%m%d)-run${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Cadangan kalau upload ke server gagal - bisa didownload dari tab Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7

      # SERVER_* sama dengan yang dipakai deploy backend (repo klarFinance) - secret gak di-share
      # antar repo, jadi harus di-set ulang di repo ini.
      - name: Upload APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: ${{ steps.apk.outputs.name }}
          target: "~/klarfinance-apk"

      # latest.apk selalu nunjuk build terbaru; cuma 10 APK terakhir yang disimpan (~140MB/APK).
      - name: Update latest & prune old APKs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/klarfinance-apk
            ln -sfn "${{ steps.apk.outputs.name }}" latest.apk
            ls -1t klarfinance-*.apk | tail -n +11 | xargs -r rm --
            ls -lh
